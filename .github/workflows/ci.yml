name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: defender
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: defender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U defender -d defender_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production image, including TypeScript and Vite
        run: docker build -t defender-explorer:ci .
      - name: Test parser, bounded workers, API, and PostgreSQL ingestion
        run: >-
          docker run --rm --network host
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          -e DATABASE_URL=postgresql+asyncpg://defender:ci-only-password@127.0.0.1:5432/defender_test
          -e TEST_DATABASE_URL=postgresql+asyncpg://defender:ci-only-password@127.0.0.1:5432/defender_test
          -e ADMIN_API_KEY=ci-only-key
          -e TEST_PDF_RENDER=1
          defender-explorer:ci python -m unittest discover -s tests -v
