services:
  db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: defender_explorer_db
    environment:
      TZ: America/New_York
      POSTGRES_USER: defender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: defender_explorer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defender -d defender_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    memswap_limit: ${DB_MEMORY_LIMIT:-768m}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defender_explorer_app
    environment:
      TZ: America/New_York
      DATABASE_URL: postgresql+asyncpg://defender:${POSTGRES_PASSWORD}@db:5432/defender_explorer
      VDM_PATH: /data/vdm
      EXTRACTED_PATH: /data/extracted
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      # Mount local VDM files (optional)
      - ${VDM_PATH:-./data/vdm}:/data/vdm:ro
      # Mount pre-extracted data (optional)
      - ${EXTRACTED_PATH:-./data/extracted}:/data/extracted:ro
    mem_limit: ${APP_MEMORY_LIMIT:-3g}
    memswap_limit: ${APP_MEMORY_LIMIT:-3g}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
